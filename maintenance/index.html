<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Constitutional Forcing · Temporarily offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f2f2f2;
        --ink: #1a1a1a;
        --mid: #555;
        --light: #888;
        --rule: #dadada;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --ink: #f5f5f0;
          --mid: #a0a0a0;
          --light: #6f6f6f;
          --rule: #2a2a2a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--light);
        margin: 0 0 2rem;
      }
      h1 {
        font-family: "STIX Two Text", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.15;
        margin: 0 0 1.5rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.7;
        color: var(--mid);
        margin: 0 0 1rem;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 2.5rem 0 1.5rem;
      }
      .contact {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--light);
      }
      a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--rule);
      }
      a:hover, a:focus-visible { border-bottom-color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Constitutional Forcing · ARC Institute of Knowware</p>
      <h1>Temporarily offline</h1>
      <p>This site is offline while the papers of the programme are being revised.</p>
      <p>It will return when the revised versions are ready.</p>
      <hr />
      <p class="contact">Enquiries: <a href="mailto:programme@knowware.institute">programme@knowware.institute</a></p>
    </main>
  </body>
</html>
